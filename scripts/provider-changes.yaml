# Provider changes - the source of the "what changed" digest.
#
# One entry per provider or vendor change the library applied after reading it on
# the provider's own page. scripts/render-whats-new.py validates this file and
# rewrites the tables of references/finops-whats-new.md from it; CI runs its --check.
#
#   as_of     the date this list was last reconciled with the weekly scan's verified
#             items. It is the freshness the reader is told, so move it only when a
#             lot is fully in. The 90-day window of the digest is counted from it.
#   entries   newest first by convention; the renderer sorts anyway.
#     date      when the change took or takes effect, or was announced: "YYYY-MM-DD",
#               or "YYYY-MM" when the provider gives only a month. A date after
#               as_of goes to "Scheduled changes".
#     provider  one of the names in PROVIDERS in scripts/render-whats-new.py.
#     service   short product or service name (optional).
#     change    one or two sentences, at most 320 characters: what changes on the
#               bill, written from the sentence the reference carries. Mechanics and
#               ratios, not prices. Straight hyphens, "%" not the word.
#     file      the reference or runbook that carries the mechanics, without ".md".
#     section   its H2 or H3 heading (optional; must match exactly one heading).
#     source    the provider page the reference cites for it (optional, https).
#
# Entries older than the window stay here as the archive; the digest drops them.

as_of: "2026-11-10"

entries:
  - date: "2026-09-21"
    provider: "AWS"
    service: "Bedrock quotas"
    change: "The per-model daily token quota on bedrock-runtime is replaced by one Cross-Model Max Tokens Per Day pool per account and Region, counted from on-demand pricing. Tokens per minute stay per model, so one runaway job on any model can exhaust the day for every workload in that account."
    file: "finops-bedrock"
    section: "CloudWatch metrics for Bedrock"
    source: "https://docs.aws.amazon.com/bedrock/latest/userguide/quotas-runtime.html"
  - date: "2027-01"
    provider: "Microsoft"
    service: "Microsoft 365 Copilot Business"
    change: "From FY27 Q3 (January to March 2027), new Copilot Business purchases in CSP turn on usage-based billing by default in all markets, with a default limit of 4,000 Copilot Credits per user per month, also for licences already in the tenant. It cannot be switched off, only capped at zero."
    file: "finops-sam"
    section: "Connection to AI Transition"
    source: "https://learn.microsoft.com/en-us/partner-center/announcements/2026-november"
  - date: "2026-11-09"
    provider: "AWS"
    service: "CloudWatch Logs"
    change: "Account-level retention policies set retention for all log groups, or a name prefix, at no charge. Overlapping policies keep the longest, but a policy replaces a log group's own setting even when that setting is longer, so a short baseline can delete compliance logs. Dry-run it first."
    file: "finops-aws-patterns-other"
    section: "Other Optimization Patterns (13)"
    source: "https://docs.aws.amazon.com/AmazonCloudWatch/latest/logs/Working-with-log-groups-and-streams.html#account-level-retention-policies"
  - date: "2026-09-18"
    provider: "AWS"
    service: "Billing Conductor"
    change: "AWS publishes a method that credits each member account its RI and Savings Plan saving from CUR 2.0 as a custom line item, because commitments bought in the management account leave billing-group pro forma bills at on-demand equivalent by default."
    file: "finops-chargeback"
    section: "Commitment benefits in an AWS Billing Conductor pro forma"
    source: "https://aws.amazon.com/blogs/aws-cloud-financial-management/implementing-proportional-reserved-instance-and-savings-plans-chargeback-with-aws-billing-conductor/"
  - date: "2026-09-15"
    provider: "AWS"
    service: "Direct Connect"
    change: "10 and 100 Gbps dedicated connections can bill at a flat hourly rate per bandwidth and tier, with data transfer out included from the Regions the tier covers. Traffic from other Regions, SiteLink and partner fees still bill separately."
    file: "finops-aws-patterns-networking"
    section: "Direct Connect flat-rate pricing"
    source: "https://docs.aws.amazon.com/directconnect/latest/PricingGuide/pricing-flat-rate.html"
  - date: "2029-11-15"
    provider: "Azure"
    service: "Virtual Machines"
    change: "After this date the Dv3, Dsv3, Ev3 and Esv3 series (32 sizes) cannot be created, resized into, run or purchased. The retirement does not apply to Azure Government, 21Vianet or sovereign cloud regions."
    file: "finops-azure-commitments"
    section: "Compute commitment instruments"
    source: "https://learn.microsoft.com/en-us/azure/virtual-machines/sizes/lifecycle/retirements-and-capacity-restrictions"
  - date: "2029-01-31"
    provider: "AWS"
    service: "ElastiCache"
    change: "Extended Support for ElastiCache Redis OSS 4 and 5 ends on 31 January 2029, when remaining caches are upgraded to Valkey automatically."
    file: "finops-aws-patterns-databases"
    section: "Databases Optimization Patterns (33)"
    source: "https://docs.aws.amazon.com/AmazonElastiCache/latest/dg/extended-support.html"
  - date: "2028-11-15"
    provider: "Azure"
    service: "Virtual Machines"
    change: "The Av2, Amv2, B (v1), F, Fs, Fsv2, G, Gs and Lsv2 VM series retire. Until then no new subscriptions or quota increases are allowed on them and they cannot be re-reserved, so plan the move to a current series and the reservation exchange or trade-in before the date."
    file: "finops-azure-commitments"
    section: "Compute commitment instruments"
    source: "https://learn.microsoft.com/en-us/azure/virtual-machines/sizes/lifecycle/retirements-and-capacity-restrictions"
  - date: "2028-09-30"
    provider: "Azure"
    service: "Azure Functions"
    change: "Linux hosting on the classic Consumption plan retires, and gets no new features or language versions in the meantime. Linux apps moved off Premium to cut cost should go to Flex Consumption, not to the classic Consumption plan."
    file: "finops-azure-patterns"
    section: "Compute Optimization Patterns (13)"
    source: "https://learn.microsoft.com/en-us/azure/azure-functions/consumption-plan"
  - date: "2028-05-01"
    provider: "Azure"
    service: "Virtual Machines"
    change: "The D, Ds, Dv2, Dsv2 and Ls VM series retire. They can no longer be reserved, so migrate to v5 or later and exchange the reservation to the new series on the way, or trade it in for a savings plan, rather than letting it run out."
    file: "finops-azure-commitments"
    section: "Compute commitment instruments"
    source: "https://learn.microsoft.com/en-us/azure/virtual-machines/sizes/lifecycle/retirements-and-capacity-restrictions"
  - date: "2027-11"
    provider: "AWS"
    service: "OpenSearch Service"
    change: "Extended Support patch coverage for legacy Elasticsearch (1.5-7.8) and OpenSearch (1.0-1.2, 2.3-2.9) versions runs to November 2027, after a 12-month extension announced in August 2026. November 2027 is the cut-off for continued Extended Support coverage on those versions."
    file: "finops-aws-billing"
    section: "Extended Support version audits (recurring action item)"
    source: "https://aws.amazon.com/about-aws/whats-new/2026/08/amazon-opensearch-service-additional-upgrade-runway-support-dates"
  - date: "2027-02-01"
    provider: "AWS"
    service: "ElastiCache"
    change: "ElastiCache for Redis OSS 6 enters paid Extended Support on 1 February 2027, as versions 4 and 5 did on 1 February 2026. The charge is a share of the on-demand node price, reserved nodes do not discount it, and it stops only when the cache is upgraded or deleted."
    file: "finops-aws-patterns-databases"
    section: "Databases Optimization Patterns (33)"
    source: "https://docs.aws.amazon.com/AmazonElastiCache/latest/dg/extended-support.html"
  - date: "2027-02-01"
    provider: "Azure"
    service: "Virtual Machines and Storage"
    change: "Announced October 2026: prices for Virtual Machines and Azure Storage rise in seven regions - North Europe 17%, France Central and South 11%, West Europe, Norway East and West 9%, Southeast Asia 8%. The v1, v2 and v7 VM series and some storage services are excluded."
    file: "finops-azure"
    section: "Region placement for cost"
    source: "https://learn.microsoft.com/en-in/answers/questions/6026564/clarification-required-azure-vm-and-storage-pricin"
  - date: "2027-02-01"
    provider: "Azure"
    service: "Reservations"
    change: "Reservation exchange retires for services a savings plan also covers (VMs, Dedicated Host, App Service, covered databases). Reservations bought before the date keep one final exchange. What remains is a refund capped at $50,000 per rolling 12 months and a trade-in to a savings plan."
    file: "finops-azure-commitments"
    section: "Commitment liquidity after February 2027"
    source: "https://learn.microsoft.com/en-us/azure/cost-management-billing/reservations/exchange-and-refund-azure-reservations"
  - date: "2027-01-12"
    provider: "European Union"
    service: "EU Data Act switching and egress charges"
    change: "From this date providers of data processing services to EU customers may not charge for the operations needed to switch or for data egress; until then they may charge only the costs they incur. The waiver covers the move, not steady-state data transfer."
    file: "finops-on-prem-hybrid"
    section: "Moving a workload out of a cloud"
    source: "https://digital-strategy.ec.europa.eu/en/factpages/data-act-explained"
  - date: "2027-01-01"
    provider: "Google Cloud"
    service: "Gemini 3.x Flash on Vertex AI"
    change: "Introductory pricing ends on Gemini 3.8 Flash, 3.7 Flash and 3.6 Flash: they bill at 50% of the standard rate through 31 December 2026 and at the standard rate from 1 January 2027. At constant volume the January bill for these SKUs is twice December's."
    file: "finops-vertexai"
    section: "Introductory pricing on the 3.x Flash SKUs - a dated forecasting item"
    source: "https://cloud.google.com/gemini-enterprise-agent-platform/generative-ai/pricing"
  - date: "2027-01-01"
    provider: "Google Cloud"
    service: "Gemini Developer API"
    change: "Explicit cache storage on the 3.8, 3.7 and 3.6 Flash SKUs stops being cheaper on the Gemini Developer API: it bills at half the Agent Platform rate per token-hour through 31 December 2026, then the two rates converge."
    file: "finops-vertexai"
    section: "Gemini Developer API (AI Studio) vs Vertex AI: same token price, different mechanics"
    source: "https://ai.google.dev/gemini-api/docs/pricing"
  - date: "2027-01-01"
    provider: "AWS"
    service: "AWS Support plans"
    change: "Enterprise On-Ramp, Business and Developer support plans end on 1 January 2027 outside GovCloud. Enterprise Support is charged as a tiered share of gross monthly charges, before discounts and credits, and a private pricing discount does not reduce it."
    file: "finops-cloud-contracts"
    section: "AWS: Private Pricing"
    source: "https://docs.aws.amazon.com/awssupport/latest/user/support-plans-eos.html"
  - date: "2026-12-03"
    provider: "FinOps Foundation"
    service: "FOCUS 1.5"
    change: "FOCUS 1.5 is scheduled for approval and ratification on 3 December 2026. The scope in development adds a SKU Price dataset and recommended model-identity and token properties for AI cost attribution; names can still change, so do not build against them yet."
    file: "finops-focus"
    section: "The version ladder"
    source: "https://focus.finops.org/?p=19885"
  - date: "2026-12-01"
    provider: "Google Cloud"
    service: "Gemini Developer API"
    change: "The Developer API reroutes every gemini-2.5-pro request to gemini-3.8-flash and every gemini-2.5-flash request to gemini-3.5-flash-lite, billed at the target model's rates. Re-run any forecast built on 2.5 rates; the free tier on 2.5 Pro ends with the rerouting."
    file: "finops-vertexai"
    section: "Gemini Developer API specifics"
    source: "https://aistudio.google.com/docs/changelog"
  - date: "2026-11-30"
    provider: "Anthropic"
    service: "Claude Sonnet 4.5"
    change: "Claude Sonnet 4.5, deprecated on 30 September 2026, is scheduled for retirement on the Claude API on 30 November 2026. Plan the migration to Sonnet 5 or 5.5, which run at 0.67x its rate, before then."
    file: "finops-anthropic"
    section: "Base token pricing: tiers and ratios"
    source: "https://platform.claude.com/docs/en/about-claude/pricing"
  - date: "2026-11-30"
    provider: "Anthropic"
    service: "Claude Opus 4.8 fast mode"
    change: "Opus 4.8 fast mode, deprecated on 30 October 2026, is removed on 30 November 2026. After that a fast request on Opus 4.8 returns an error and does not fall back to standard speed. The migration path is Opus 5.5, where the same 2x sits on a lower standard rate."
    file: "finops-anthropic"
    section: "Fast mode pricing"
    source: "https://platform.claude.com/docs/en/release-notes/overview"
  - date: "2026-11-30"
    provider: "GitHub"
    service: "GitHub Copilot Fusion"
    change: "Copilot Fusion bills each model it uses at that model's standard rate, with no Fusion charge, and its High and Max levels can call several models per task. Paid plans get 30% off model costs under Fusion until 30 November 2026, so re-baseline in December."
    file: "finops-ai-dev-tools"
    section: "GitHub Copilot"
    source: "https://docs.github.com/en/copilot/concepts/models/copilot-fusion"
  - date: "2026-11-16"
    provider: "GitHub"
    service: "GitHub Copilot models"
    change: "Copilot retires Claude Opus 4.8, Claude Opus 5 and GPT-5.6 Terra from every surface on 16 November 2026. Replacements switch on automatically on Business and Enterprise unless default enablement is off. Under AI Credits the cost per request follows the model, so re-baseline spend."
    file: "finops-ai-dev-tools"
    section: "GitHub Copilot"
    source: "https://github.blog/changelog/2026-10-15-upcoming-deprecation-of-selected-github-copilot-models-in-mid-november"
  - date: "2026-11-09"
    provider: "Anthropic"
    service: "Claude Fable 5.2 and Mythos 5.2"
    change: "Claude Fable 5.2 is released at 0.8x the Fable 5.1 rate (1.6x Opus 5), with cache reads at 0.025x input; Mythos 5.2 is the same model and price for verified organisations. A workload pinned to Fable 5.1 now pays more per token. It requires 30-day data retention."
    file: "finops-anthropic"
    section: "Base token pricing: tiers and ratios"
    source: "https://platform.claude.com/docs/en/about-claude/pricing"
  - date: "2026-11-06"
    provider: "AWS"
    service: "EC2 Capacity Blocks"
    change: "CUR 2.0 and Cost Explorer amortise the upfront fee of an EC2 Capacity Block over the reservation. GPU block spend no longer spikes on the purchase date in amortised views."
    file: "finops-aws-commitments"
    section: "Compute commitment instruments"
  - date: "2026-11-02"
    provider: "Anthropic"
    service: "Claude Code gateway"
    change: "Claude Code v2.1.317 adds a cost report to the gateway admin API: past spend over a date range in total, per developer, per day or per IdP group. It also adds plan, seat type and provider attributes to OTel metrics, events and spans."
    file: "finops-ai-dev-tools"
    section: "Cost tracking for Claude Code"
    source: "https://github.com/anthropics/claude-code/blob/main/CHANGELOG.md"
  - date: "2026-11-01"
    provider: "Databricks"
    service: "Unity Gateway"
    change: "A Unity Gateway budget now also counts spend from task-specific AI Functions (ai_parse_document, ai_extract, ai_classify) in batch and real-time runs. A threshold sized for chat or agent traffic can now alert on, or block, a document-processing job."
    file: "finops-databricks"
    section: "Serverless usage policies and budgets - attribution and alerting are separate"
    source: "https://docs.databricks.com/aws/en/release-notes/product/2026/november"
  - date: "2026-11"
    provider: "AWS"
    service: "OpenSearch Service"
    change: "From November 2026 the Extended Support surcharge on legacy Elasticsearch (1.5-7.8) and OpenSearch (1.0-1.2, 2.3-2.9) domains rises to 100% of instance pricing, an effective 2x compute cost for domains still on those versions."
    file: "finops-aws-billing"
    section: "Extended Support version audits (recurring action item)"
    source: "https://aws.amazon.com/about-aws/whats-new/2026/08/amazon-opensearch-service-additional-upgrade-runway-support-dates"
  - date: "2026-11"
    provider: "GitHub"
    service: "GitHub Copilot cloud agent"
    change: "Copilot cloud agent sessions run in a cloud sandbox by default and are billed from November 2026 against the included Actions entitlement, now one dollar-based pool shared with CI runners. Heavy agent use can first show up as Actions overage."
    file: "finops-ai-dev-tools"
    section: "GitHub Copilot"
    source: "https://docs.github.com/en/billing/concepts/product-billing/github-actions"
  - date: "2026-11"
    provider: "Anthropic"
    service: "Claude Code gateway"
    change: "Claude Code v2.1.318 adds assume_role on Bedrock upstreams, including for per-developer AWS cost attribution. v2.1.319 adds settings for which pooled group budget pays first when a developer belongs to several groups: set them explicitly, or budgets draw down in an order nobody chose."
    file: "finops-ai-dev-tools"
    section: "Cost tracking for Claude Code"
    source: "https://github.com/anthropics/claude-code/blob/main/CHANGELOG.md"
  - date: "2026-10-30"
    provider: "AWS"
    service: "Bedrock (OpenAI GPT-5.6 Terra and Luna)"
    change: "OpenAI GPT-5.6 Terra and Luna run in both GovCloud (US) Regions on bedrock-runtime, with cross-Region inference confined to GovCloud. Usage is itemised per model in Cost Explorer and the CUR, but the Bedrock product attributes do not reach GovCloud, so group by usage type there."
    file: "finops-bedrock"
    section: "AgentCore in GovCloud - regulated-workload cost governance"
    source: "https://aws.amazon.com/about-aws/whats-new/2026/10/bedrock-openai-runtime-govcloud/"
  - date: "2026-10-29"
    provider: "AWS"
    service: "RDS for Oracle and SQL Server"
    change: "Storage autoscaling also covers up to three additional volumes (256 TiB in total), with a maximum per volume and no charge beyond the storage provisioned. Additional volumes no longer need to be over-provisioned by hand to avoid a resize."
    file: "finops-aws"
    section: "Common database cost drivers"
    source: "https://aws.amazon.com/about-aws/whats-new/2026/10/amazon-rds-oracle-sqlserver-autoscaling-additional-storage-volumes"
  - date: "2026-10-29"
    provider: "Anthropic"
    service: "Usage and Cost Analytics API"
    change: "Anthropic's Usage and Cost Analytics API enters beta: it splits usage and cost by up to five dimensions, API key and actor included, in 1-minute, hourly or daily buckets. Per-key and per-identity cost no longer has to be computed from usage."
    file: "finops-for-ai"
    section: "The full AI cost surface"
    source: "https://platform.claude.com/docs/en/manage-claude/usage-cost-analytics-api"
  - date: "2026-10-28"
    provider: "AWS"
    service: "ECS Managed Instances"
    change: "The Managed Instances capacity provider repacks tasks across several under-filled instances at once, on by default and at no charge. It removes the manual bin-pack-and-drain cycle, not the task sizing: oversized task definitions still need rightsizing first."
    file: "finops-aws"
    section: "Container rightsizing (ECS / EKS)"
    source: "https://aws.amazon.com/about-aws/whats-new/2026/10/ecs-managed-instances-consolidation/"
  - date: "2026-10-28"
    provider: "AWS"
    service: "OpenSearch Serverless"
    change: "Time series collections on the next generation of OpenSearch Serverless add a warm tier with a configurable hot-to-warm age, up to 100 TB hot per collection. Observability data no longer has to stay in hot search storage; the warm rate is on the pricing page, not in the announcement."
    file: "finops-aws"
    section: "Common database cost drivers"
    source: "https://aws.amazon.com/about-aws/whats-new/2026/10/time-series-collection-next-generation-opensearch-serverless/"
  - date: "2026-10-28"
    provider: "GitHub"
    service: "GitHub Copilot access"
    change: "Copilot access removes the Copilot seat charge for users with a GitHub Enterprise Cloud licence (through account teams first); users without one take Copilot Standalone per user. Neither includes monthly AI credits, so all usage is metered against the enterprise budget from the first request."
    file: "finops-ai-dev-tools"
    section: "GitHub Copilot"
    source: "https://docs.github.com/en/copilot/get-started/whats-changing-with-github-enterprise-and-copilot"
  - date: "2026-10-27"
    provider: "AWS"
    service: "ECS"
    change: "Several ECS tasks can share one NVIDIA GPU through MPS, each declaring the GPU memory it needs, on ECS Managed Instances and ECS on EC2. Small inference and embedding tasks that each held a whole GPU can share one."
    file: "finops-aws"
    section: "GPU instance rightsizing"
    source: "https://aws.amazon.com/about-aws/whats-new/2026/10/amazon-ecs-gpu-sharing-nvidia-mps/"
  - date: "2026-10-27"
    provider: "AWS"
    service: "Aurora Serverless v2"
    change: "Serverless v2 on Aurora PostgreSQL scales to 384 ACUs (about 768 GiB) instead of 256, still down to zero, on Platform Version 4. Bursty workloads above the old ceiling no longer need a provisioned instance."
    file: "finops-aws"
    section: "Common database cost drivers"
    source: "https://aws.amazon.com/about-aws/whats-new/2026/10/aurora-serverless-supports-384-acu/"
  - date: "2026-10-27"
    provider: "AWS"
    service: "Neptune"
    change: "Neptune adds an online index rebuild (engine 1.5.0.0, provisioned writer instances) that reclaims storage held by fragmented indexes after deletes, with reads and writes continuing. Until now that storage never shrank and kept VolumeBytesUsed and I/O high."
    file: "finops-aws"
    section: "Common database cost drivers"
    source: "https://aws.amazon.com/about-aws/whats-new/2026/10/neptune-online-index-rebuild/"
  - date: "2026-10-26"
    provider: "AWS"
    service: "Bedrock (OpenAI GPT-6.1 Terra)"
    change: "AWS states that OpenAI GPT-6.1 Terra on Bedrock is priced at least 50% below GPT-6.1 Sol and GPT-5.6 Terra on both token types, with a 1M-token input context and text and image input."
    file: "finops-bedrock"
    section: "On-demand pricing structure"
