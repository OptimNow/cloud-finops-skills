name: CI

# Lightweight read-only checks on every PR and every push to main. No write
# permissions, no publish - that lives in auto-tag-on-plugin-bump.yml which
# only fires on a plugin.json version bump. This job just catches drift and
# regressions before merge.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    name: Drift checks + MCP tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0

      - name: FCP frontmatter coverage (--check)
        run: bash scripts/fcp-coverage.sh --check

      - name: Waste-playbook coverage matrix (--check)
        run: bash scripts/playbook-coverage.sh --check

      - name: Coverage heat map SVG (--check)
        run: python scripts/render-coverage-heatmap.py --check

      - name: FCP capability heat map SVG (--check)
        run: python scripts/render-fcp-heatmap.py --check

      - name: llms.txt reference list in sync
        run: bash scripts/check-llms-txt.sh

      # llms-full.txt inlines the whole library for one-fetch ingestion. It is
      # not committed (over the Claude directory's 256 KiB per-file limit); the
      # release workflows build it and attach it to the GitHub Release. This
      # step only proves the build still renders every source file, so a
      # release is never the first place a broken build shows up.
      - name: llms-full.txt builds completely (--smoke)
        run: bash scripts/build-llms-full.sh --smoke

      - name: CLAUDE.md structure tree in sync
        run: bash scripts/check-docs-drift.sh

      # The truncation tripwire. Two documented incidents (April and May 2026)
      # shipped reference files that had lost their tail, and the missing
      # footer was the only signal - which nothing checked. See the CLAUDE.md
      # "Pipeline applier truncated 8 reference files" entry.
      - name: Every reference and playbook keeps its footer
        run: bash scripts/check-footers.sh

      # SKILL.md and POWER.md are two entry points onto one body of content and
      # have drifted before (a routing row added to one only).
      - name: SKILL.md and POWER.md have not drifted
        run: bash scripts/check-skill-power-parity.sh

      - name: Installer artefacts within the size ceiling
        run: bash scripts/check-artefact-size.sh

      # The plugin folder is plugins/cloud-finops/ (since 2026-10-01), and every
      # file under it is part of the Claude directory listing. Two holds to keep
      # off: a non-image, non-font file over 256 KiB, or more than 512 files
      # (ceiling 480 here).
      - name: Plugin folder within the Claude directory file limits
        run: bash scripts/check-plugin-file-limits.sh

      # Decision of 2026-09-30: the plugin ships the skill only and the hosted
      # connector is listed separately. No .mcp.json, no mcpServers key.
      - name: Plugin is skill-only (no bundled MCP server)
        run: bash scripts/check-plugin-skill-only.sh

      # The directory's security scan holds a version for a reviewer on an image
      # or other non-text file, a $VAR beside a URL, a curl-pipe-to-shell line or
      # a package launcher. The first root-folder validation (2026-10-01) raised
      # 13 such holds from developer tooling; the plugin folder must stay clean.
      - name: Plugin folder free of directory scanner triggers
        run: bash scripts/check-plugin-content.sh

      # Also gated by its own marketplace-version-check workflow, but that one
      # is path-filtered: it fires only when plugin.json or marketplace.json
      # changes. Pre-existing drift on main therefore never gets re-detected,
      # and the release train reads marketplace.json. It runs in well under a
      # second, so there is no reason not to run it on every PR too.
      - name: Marketplace version matches plugin.json
        run: bash scripts/check-marketplace-version.sh

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: mcp_server/pyproject.toml

      - name: Install MCP server (with dev extras)
        working-directory: mcp_server
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      # The dev extra has always pulled ruff and pyproject.toml has always
      # carried a [tool.ruff] config; nothing invoked it until now.
      - name: Lint MCP server (ruff)
        working-directory: mcp_server
        run: python -m ruff check .

      # Needs PyYAML, so it runs after the install above rather than with the
      # other drift checks.
      - name: SKILL.md description within the claude.ai limit
        run: bash scripts/check-skill-description.sh

      - name: Sync references into bundled data/
        working-directory: mcp_server
        run: python scripts/sync_references.py

      - name: MCP server tests
        working-directory: mcp_server
        run: python -m pytest -q
