  # ---- Google Cloud: Billing Catalog API with a key, the pricing page without -------------

  gcp-gke-cluster-hour:
    provider: gcp
    unit: USD per cluster-hour
    note: The catalog SKU description is the one documented for the cluster management fee; it is read only when GOOGLE_API_KEY is set and has not yet been exercised. The page regex is.
    query:
      catalog: {service: services/CCD8-9BF1-090E, description: Regional Kubernetes Clusters}
      page: {url: 'https://cloud.google.com/kubernetes-engine/pricing', regex: 'cluster management fee of \$([0-9.]+) per cluster per hour'}
  gcp-gke-free-tier-month:
    provider: gcp
    unit: USD of credit per billing account per month
    note: A credit, not a SKU; the pricing page is its only source.
    query:
      page: {url: 'https://cloud.google.com/kubernetes-engine/pricing', regex: 'free tier provides \$([0-9.]+) in monthly credits'}
  gcp-pd-ssd-gib-month-us-central1:
    provider: gcp
    unit: USD per GiB-month, us-central1
    note: The page shows the default region (Iowa, us-central1) by the hour; 730 brings it to the month the catalog quotes.
    query:
      catalog: {service: services/6F81-5844-456A, description: SSD backed PD Capacity, region: us-central1}
      page: {url: 'https://cloud.google.com/compute/disks-image-pricing', regex: 'SSD provisioned space</p></td><td[^>]*>\$([0-9.]+) / 1 gibibyte hour', unit_factor: 730}

