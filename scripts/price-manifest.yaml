    unit: USD per GB read
    query:
      service_code: AmazonS3
      filters: {usagetype: USE1-Files-Read, location: US East (N. Virginia)}
  aws-s3-files-write-gb:
    provider: aws
    unit: USD per GB written
    query:
      service_code: AmazonS3
      filters: {usagetype: USE1-Files-Write, location: US East (N. Virginia)}
  aws-efs-standard-gb-month:
    provider: aws
    unit: USD per GB-month
    query:
      service_code: AmazonEFS
      filters: {usagetype: USE1-TimedStorage-ByteHrs, location: US East (N. Virginia)}
  aws-efs-ia-gb-month:
    provider: aws
    unit: USD per GB-month
    query:
      service_code: AmazonEFS
      filters: {usagetype: USE1-IATimedStorage-ByteHrs, location: US East (N. Virginia)}
  aws-efs-archive-gb-month:
    provider: aws
    unit: USD per GB-month
    query:
      service_code: AmazonEFS
      filters: {usagetype: USE1-ArchiveTimedStorage-ByteHrs, location: US East (N. Virginia)}

  # ---- Azure: Retail Prices API, East US unless the text says otherwise -------------------

  azure-app-service-p1v3-linux-hour:
    provider: azure
    unit: USD per hour
    query:
      filter: serviceName eq 'Azure App Service' and armRegionName eq 'eastus' and priceType eq 'Consumption' and skuName eq 'P1 v3' and productName eq 'Azure App Service Premium v3 Plan - Linux'
  azure-app-service-p1v3-windows-hour:
    provider: azure
    unit: USD per hour
    query:
      filter: serviceName eq 'Azure App Service' and armRegionName eq 'eastus' and priceType eq 'Consumption' and skuName eq 'P1 v3' and productName eq 'Azure App Service Premium v3 Plan'
  azure-app-service-s1-linux-hour:
    provider: azure
    unit: USD per hour
    query:
      filter: serviceName eq 'Azure App Service' and armRegionName eq 'eastus' and priceType eq 'Consumption' and skuName eq 'S1' and productName eq 'Azure App Service Standard Plan - Linux'
  azure-app-service-s1-windows-hour:
    provider: azure
    unit: USD per hour
    query:
      filter: serviceName eq 'Azure App Service' and armRegionName eq 'eastus' and priceType eq 'Consumption' and skuName eq 'S1' and productName eq 'Azure App Service Standard Plan'
  azure-app-service-p0v3-linux-hour:
    provider: azure
    unit: USD per hour
    note: The SKU is spelt P0v3 in the API, P1 v3 with a space; both spellings are the API's.
    query:
      filter: serviceName eq 'Azure App Service' and armRegionName eq 'eastus' and priceType eq 'Consumption' and skuName eq 'P0v3' and productName eq 'Azure App Service Premium v3 Plan - Linux'
  azure-app-service-p0v3-windows-hour:
    provider: azure
    unit: USD per hour
    query:
      filter: serviceName eq 'Azure App Service' and armRegionName eq 'eastus' and priceType eq 'Consumption' and skuName eq 'P0v3' and productName eq 'Azure App Service Premium v3 Plan'
  azure-log-analytics-ingestion-gb:
    provider: azure
    unit: USD per GB ingested, pay-as-you-go
    note: Two rows come back, the free first 5 GB at 0 and the paid rate; the zero row is dropped.
    query:
      filter: serviceName eq 'Log Analytics' and armRegionName eq 'eastus' and priceType eq 'Consumption' and meterName eq 'Analytics Logs Data Ingestion'
  azure-blob-archive-lrs-gb-month:
    provider: azure
    unit: USD per GB-month
    query:
      filter: serviceName eq 'Storage' and armRegionName eq 'eastus' and priceType eq 'Consumption' and productName eq 'General Block Blob v2' and meterName eq 'Archive LRS Data Stored'
  azure-disk-p30-month:
    provider: azure
    unit: USD per disk-month (1 TiB Premium SSD)
    query:
      filter: serviceName eq 'Storage' and armRegionName eq 'eastus' and priceType eq 'Consumption' and productName eq 'Premium SSD Managed Disks' and meterName eq 'P30 LRS Disk'
  azure-disk-e30-month:
    provider: azure
    unit: USD per disk-month (1 TiB Standard SSD)
    query:
      filter: serviceName eq 'Storage' and armRegionName eq 'eastus' and priceType eq 'Consumption' and productName eq 'Standard SSD Managed Disks' and meterName eq 'E30 LRS Disk'
  azure-public-ip-standard-hour:
    provider: azure
