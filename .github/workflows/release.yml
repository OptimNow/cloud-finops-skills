name: Release skill zip

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0

      - name: Build zip of cloud-finops skill folder
        run: |
          VERSION="${GITHUB_REF_NAME}"
          ZIP_NAME="cloud-finops-${VERSION}.zip"
          cd "${GITHUB_WORKSPACE}"
          # Exclude local-only directories that may exist in worktrees
          # (e.g. .claude/settings.local.json from Claude Code worktrees).
          # cd into the plugin's skills/ so the zip root contains
          # `cloud-finops/...` rather than the repository path. Backward-compatible
          # with the Claude.ai / Claude Desktop upload path (Settings -> Skills ->
          # Upload) and unchanged by the 2026-10-01 move to plugins/cloud-finops/.
          (cd plugins/cloud-finops/skills && zip -r "../../../${ZIP_NAME}" cloud-finops \
            -x 'cloud-finops/.claude/*' \
            -x 'cloud-finops/**/.backups/*' \
            -x 'cloud-finops/.git/*')
          ls -lh "${ZIP_NAME}"
          unzip -l "${ZIP_NAME}" | head -5  # log the first few entries to verify forward-slash paths
          echo "ZIP_NAME=${ZIP_NAME}" >> "$GITHUB_ENV"

      # llms-full.txt is not committed (it is over the Claude directory's
      # 256 KiB per-file limit and the plugin folder is the repository root).
      # Built here from the tagged commit and attached below, which is what
      # makes releases/latest/download/llms-full.txt (linked from llms.txt)
      # resolve. The script fails if the render is incomplete.
      - name: Build llms-full.txt
        run: bash scripts/build-llms-full.sh

      - name: Create GitHub Release with zip and llms-full.txt attached
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65  # v2.6.2
        with:
          name: ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          files: |
            ${{ env.ZIP_NAME }}
            llms-full.txt
          generate_release_notes: true
          body: |
            ## Cloud FinOps Skill & MCP ${{ github.ref_name }}

            The attached `cloud-finops-${{ github.ref_name }}.zip` is the skill bundle for upload into Claude Desktop / claude.ai (Settings → Skills → Upload).

            The attached `llms-full.txt` is the whole library (entry point, references, playbooks) in one file, built from this tag; `llms.txt` links to the latest-release copy.

            For Claude Code users (and 11 other tools), see [INSTALLATION.md](https://github.com/OptimNow/cloud-finops-skills/blob/main/INSTALLATION.md) for the cross-tool installer and the model-agnostic response contract.
