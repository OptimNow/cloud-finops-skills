name: Price drift

# Weekly re-read of every static list price the skill carries (scripts/price-manifest.yaml)
# against the providers' own price lists: the AWS Price List API, the Azure Retail Prices
# API, the Google Cloud Billing Catalog API or a Google pricing page. The 9 November 2026
# pass did this by hand and found four stale figures; this workflow does it every Saturday
# and, when a figure has moved or a query broke, opens or updates one issue labelled
# `price-drift` with the report. It never edits a content file: the maintainer re-reads the
# figure on the provider's page and applies it in a content PR (docs/DESIGN.md, "Content
# update pipeline", "Price drift check").
#
# Credentials are repository secrets, all optional:
#   PRICE_CHECK_AWS_ACCESS_KEY_ID / PRICE_CHECK_AWS_SECRET_ACCESS_KEY
#       an IAM user whose only permission is pricing:GetProducts (the API is free)
#   PRICE_CHECK_GOOGLE_API_KEY
#       an API key restricted to the Cloud Billing API; without it the Google figures are
#       read from the pricing pages named in the manifest
# Azure's Retail Prices API is public. A provider whose secret is missing is reported as
# skipped; the run exits 2 for that reason only when nothing at all could be checked.
#
# Exit codes of scripts/check-prices.py: 0 no drift, 1 drift, 2 a query failed or a manifest
# anchor no longer matches its file. The issue step runs on 1 and 2, and the job then fails
# so the run shows red in the Actions list and the maintainer is notified.

on:
  schedule:
    # Saturdays 12:00 UTC (13:00-14:00 CET), after the morning content scan has run.
    - cron: '0 12 * * 6'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check:
    name: Compare the written prices with the live price lists
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: '3.12'

      - name: Install the three libraries the script needs
        run: |
          python -m pip install --upgrade pip
          pip install boto3 requests pyyaml

      - name: Run the check
        id: check
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.PRICE_CHECK_AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.PRICE_CHECK_AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: us-east-1
          GOOGLE_API_KEY: ${{ secrets.PRICE_CHECK_GOOGLE_API_KEY }}
        run: |
          set +e
          python scripts/check-prices.py --output price-drift-report.md
          code=$?
          set -e
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          cat price-drift-report.md >> "$GITHUB_STEP_SUMMARY"
          echo "check-prices exited $code"

      - name: Open or update the price-drift issue
        if: steps.check.outputs.exit_code != '0'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          EXIT_CODE: ${{ steps.check.outputs.exit_code }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          gh label create price-drift --force --color D93F0B \
            --description "A list price written in the skill has moved, or its weekly check broke"
          today="$(date -u +%Y-%m-%d)"
          title="Price drift - $today"
          case "$EXIT_CODE" in
            1) verdict="At least one figure written in the skill no longer matches the provider's list price." ;;
            *) verdict="A price query failed or a manifest anchor no longer matches its file, so part of the library is unverified this week." ;;
          esac
          {
            echo "Weekly check of the list prices written in the skill against the providers' price lists ([run]($RUN_URL), exit code $EXIT_CODE)."
            echo
            echo "$verdict Nothing has been edited: re-read each figure on the provider's page, change the number and its date in the file and the \`figure\` field in \`scripts/price-manifest.yaml\` in a content PR, and close this issue from that PR. A failed query is fixed in the manifest (docs/DESIGN.md, \"Content update pipeline\", \"Price drift check\")."
            echo
            cat price-drift-report.md
          } > issue-body.md
          existing="$(gh issue list --label price-drift --state open --json number --jq '.[0].number // empty')"
          if [ -n "$existing" ]; then
            gh issue edit "$existing" --title "$title" --body-file issue-body.md
            echo "Updated issue #$existing"
          else
            gh issue create --title "$title" --label price-drift --body-file issue-body.md
          fi

      - name: Fail the run when the check did not pass
        if: steps.check.outputs.exit_code != '0'
        run: |
          echo "::error::check-prices exited ${{ steps.check.outputs.exit_code }}; see the price-drift issue"
          exit 1
