    provider: "OpenAI"
    service: "OpenAI API service tiers"
    change: "OpenAI lets Platform settings restrict which service tiers (default, flex, priority) each project can use, with organisation settings a project cannot override. Fast is evaluated as priority, so blocking priority blocks Fast. A request that resolves to a blocked tier returns a 400 error."
    file: "finops-ai-dev-tools"
    section: "For BYOK tools (Claude Code, Codex)"
    source: "https://developers.openai.com/api/docs/guides/error-codes"
  - date: "2026-10-21"
    provider: "Databricks"
    service: "System tables (Lakeflow pipelines)"
    change: "The system.lakeflow.pipelines system table is generally available. Joining it to billing usage on the pipeline ID gives cost per pipeline, which is where materialised views, online tables, AI Search indexing and Lakeflow Connect ingestion appear."
    file: "finops-databricks"
    section: "`system.billing.usage` - the canonical billing table"
    source: "https://docs.databricks.com/aws/en/admin/system-tables/jobs"
  - date: "2026-10-20"
    provider: "OpenAI"
    service: "Responses API prompt caching"
    change: "OpenAI's Responses API adds a 12-hour prompt-cache lifetime on GPT-5.6 and later, at 2.5x input per write with the same read rate. One 12-hour write costs two 30-minute writes, so it pays only where the prefix would otherwise be written three or more times in 12 hours."
    file: "finops-for-ai"
    section: "Phase 3: Optimize"
  - date: "2026-10-15"
    provider: "Anthropic"
    service: "Claude Opus 5.5 fast mode"
    change: "Opus 5.5 fast mode leaves research preview: no beta header and no access request, so any key in the Start tier or above can pay the 2x premium. The allow-list now has to live in the gateway or client configuration. It is also on Azure-hosted Foundry deployments."
    file: "finops-anthropic"
    section: "Fast mode pricing"
    source: "https://platform.claude.com/docs/en/build-with-claude/fast-mode"
  - date: "2026-10-13"
    provider: "Google Cloud"
    service: "Cloud Billing spend cap budgets"
    change: "Spend cap budgets are generally available (announced 26 August 2026): a monthly cap per project pauses new usage of Gemini API, Agent Platform, Cloud Run or Cloud Run functions. The cap reads gross list price and also pauses usage covered by CUDs and Provisioned Throughput."
    file: "finops-vertexai"
    section: "Project-level spend caps for agent workloads"
    source: "https://docs.cloud.google.com/billing/docs/release-notes"
  - date: "2026-10-12"
    provider: "AWS"
    service: "Lambda"
    change: "Lambda adds Web Functions, billed on active vCPU-seconds plus memory held for the environment's whole life, with requests at 1.5x the Event Functions charge. Existing functions become Event Functions at unchanged pricing. AWS has not said whether Compute Savings Plans cover Web Functions."
    file: "finops-aws"
    section: "Lambda Web Functions and Event Functions (October 2026)"
    source: "https://aws.amazon.com/about-aws/whats-new/2026/10/aws-lambda-web-functions/"
  - date: "2026-10-08"
    provider: "AWS"
    service: "Bedrock (TwelveLabs Pegasus 1.5)"
    change: "TwelveLabs Pegasus 1.5 is on Bedrock, billed per second of video input plus per 1M output tokens, with the output cap raised from 4,096 to 98,304 tokens. It is billed through AWS Marketplace under the model provider, so a Cost Explorer or CUR filter on the Bedrock service misses the charges."
    file: "finops-bedrock"
    section: "Billing dimensions"
    source: "https://docs.aws.amazon.com/bedrock/latest/userguide/model-card-twelvelabs-pegasus-v1-5.html"
  - date: "2026-10-08"
    provider: "AWS"
    service: "Cost Explorer (Bedrock)"
    change: "Cost Explorer and Cost Management Dashboards can group and filter Bedrock cost by model, model provider, inference type and feature, and AWS Budgets can filter by them, at no extra charge. Attribute data starts on 1 September 2026, so no 13-month model-level trend exists before September 2027."
    file: "finops-bedrock"
    section: "Cost Explorer integration"
    source: "https://aws.amazon.com/about-aws/whats-new/2026/10/aws-bedrock-attributes-in-cost-explorer/"
  - date: "2026-10-08"
    provider: "AWS"
    service: "Bedrock (OpenAI GPT-6.1 Sol)"
    change: "OpenAI GPT-6.1 Sol on Bedrock has the same Ultrafast tier, at 6x Standard on every token type, with Priority, Flex and Reserved unavailable. AWS has not published the CUR usage type for Ultrafast; the tier shows in the ServiceTier and ResolvedServiceTier CloudWatch dimensions."
    file: "finops-bedrock"
    section: "Service tiers and speed tiers"
    source: "https://aws.amazon.com/about-aws/whats-new/2026/10/openai-gpt-sol-ultrafast-amazon/"
  - date: "2026-10-07"
    provider: "Anthropic"
    service: "Claude Haiku 5.5"
    change: "Claude Haiku 5.5 is priced by prompt length: a request whose prompt passes 100K tokens, cached tokens included, pays 5x on every meter. Below the step it costs a tenth of Haiku 4.5 per token, on a tokenizer that counts about 30% more tokens for the same text."
    file: "finops-anthropic"
    section: "Base token pricing: tiers and ratios"
    source: "https://platform.claude.com/docs/en/about-claude/pricing"
  - date: "2026-10-06"
    provider: "OpenAI"
    service: "OpenAI API usage tiers"
    change: "OpenAI's API has three paid usage tiers, Build, Launch and Grow, reached automatically by cumulative credit purchases, each with a monthly usage limit. The days-since-first-payment condition is gone. The tier is a ceiling, not a budget."
    file: "finops-for-ai"
    section: "Phase 4: Govern"
    source: "https://developers.openai.com/api/docs/changelog"
  - date: "2026-10-06"
    provider: "AWS"
    service: "Amazon Bedrock AgentCore Memory"
    change: "AgentCore short-term memory bills by data volume instead of a flat rate per event: ingestion and retrieval per GB (each event counted at 12 KB minimum, 64 KB maximum) and storage per GB-month over each event's time to live. Retrieval and event expiry become cost levers."
    file: "finops-agentic"
    section: "Agentic cost anatomy - where the tokens go"
    source: "https://aws.amazon.com/about-aws/whats-new/2026/10/agentcore-memory-consumption-based-pricing/"
  - date: "2026-10-01"
    provider: "AWS"
    service: "ECS"
    change: "The Container Insights RunningTaskCount metric is no longer billed, and ECS publishes LiveTaskCount as a free service metric without Container Insights. A cluster that enabled Container Insights only for a task count can drop it; every other Container Insights metric is still charged."
    file: "finops-aws"
    section: "Container rightsizing (ECS / EKS)"
    source: "https://aws.amazon.com/about-aws/whats-new/2026/10/ecs-service-metrics/"
  - date: "2026-10"
    provider: "AWS"
    service: "AWS Settings spend limits"
    change: "AWS is releasing spend limits in AWS Settings to a limited number of customers: a monthly, pre-tax ceiling per project (one AWS account). At the limit AWS pauses the project and stops all its resources; a project left paused for 90 days has its data permanently deleted."
    file: "finops-aws-billing"
    section: "Spend limits in AWS Settings (limited release)"
    source: "https://docs.aws.amazon.com/accounts/latest/reference/create-spend-limit.html"
  - date: "2026-10"
    provider: "Google Cloud"
    service: "Cloud Billing FOCUS export"
    change: "Google Cloud offers a dedicated FOCUS export to a Google-provided immutable BigQuery dataset, in preview for FOCUS 1.0 and 1.2, with a published conformance-gap report. The earlier SQL view over the standard export mapped to 1.0 only."
    file: "finops-gcp"
    section: "FOCUS billing export"
    source: "https://cloud.google.com/billing/docs/how-to/export-data-bigquery-focus"
  - date: "2026-09-30"
    provider: "AWS"
    service: "Bedrock (OpenAI GPT-6 Astra)"
    change: "OpenAI GPT-6 Astra on Bedrock has an Ultrafast speed tier priced at 6x Standard on every token type, cache writes and reads included, selected per request. Priority, Flex and Reserved are not available on that model."
    file: "finops-bedrock"
    section: "Service tiers and speed tiers"
    source: "https://docs.aws.amazon.com/bedrock/latest/userguide/model-card-openai-gpt-6-astra.html"
  - date: "2026-09-30"
    provider: "Anthropic"
    service: "Claude Code gateway"
    change: "Claude Code v2.1.286 fixes two under-counts in the gateway spend meter: 1-hour cache writes priced at the 5-minute rate, and streamed turns with a server-side tool counting only the first call's input. Nobody was over-billed, but a spend limit could trip later than set."
    file: "finops-ai-dev-tools"
    section: "Cost tracking for Claude Code"
    source: "https://github.com/anthropics/claude-code/releases/tag/v2.1.286"
  - date: "2026-09-29"
    provider: "Azure"
    service: "Advisor commitment recommendations"
    change: "Savings plan and reservation recommendations, P3 reservations included, are produced at management group scope in the portal and the REST endpoints, aggregating every subscription under the group. Summing per-subscription recommendations by hand over-commits."
    file: "finops-azure-commitments"
    section: "Commitment sizing methodology - granularity, Advisor calibration, tooling"
    source: "https://techcommunity.microsoft.com/blog/finopsblog/now-available-management-group%E2%80%93scoped-savings-plan-and-reservation-recommendatio/4560869"
  - date: "2026-09-28"
    provider: "Anthropic"
    service: "Claude Sonnet 5.5"
    change: "Claude Sonnet 5.5 launches at the Sonnet 5 rate, with cache reads at 0.05x input against 0.1x on Sonnet 5. It carries breaking API changes from Sonnet 5, so the upgrade is an engineering change at constant unit cost."
    file: "finops-anthropic"
    section: "Base token pricing: tiers and ratios"
    source: "https://platform.claude.com/docs/en/about-claude/pricing"
  - date: "2026-09-25"
    provider: "AWS"
    service: "Billing and Cost Management"
    change: "The ListBillingViewSegments API returns an account's billing context over a period, in time segments naming the management account, billing transfer account and billing-group primary account that applied. Run it before reconciling a month in which an account changed organisation or billing group."
    file: "finops-aws-billing"
    section: "Billing transfer"
    source: "https://aws.amazon.com/about-aws/whats-new/2026/09/aws-billing-and-cost-management-billing-context-api/"
  - date: "2026-09-25"
    provider: "Azure"
    service: "Reserved VM Instances"
    change: "Microsoft's retirement page makes new or renewed 1-year and 3-year reservations unavailable on all affected A, B, D, E, F and L variants of v1 to v3. Existing reservations run to term, then usage falls to pay-as-you-go unless a Compute Savings Plan absorbs it."
    file: "finops-azure-commitments"
    section: "Compute commitment instruments"
    source: "https://learn.microsoft.com/en-us/azure/virtual-machines/sizes/lifecycle/retirements-and-capacity-restrictions"
  - date: "2026-09-25"
    provider: "AWS"
    service: "Enterprise Support (Billing API)"
    change: "The AWS Billing API now breaks the Enterprise Support charge down per linked account, prorated by time on the plan, with a flag saying whether the month's charge is estimated or final. The split no longer requires a support case."
    file: "finops-allocation-showback"
    section: "Provider support fees"
    source: "https://aws.amazon.com/blogs/aws-cloud-financial-management/programmatically-understand-your-aws-enterprise-support-charges-with-the-aws-billing-api/"
  - date: "2026-09-24"
    provider: "Anthropic"
    service: "Claude API refusal billing"
    change: "A refusal that arrives before any output is now billed at the model's normal rates in three categories (bio, frontier_llm, reasoning_extraction), on every platform that serves Claude. With a fallback model, the refused attempt is billed on top of the retry."
    file: "finops-anthropic"
    section: "Refusals and fallback billing"
    source: "https://platform.claude.com/docs/en/release-notes/api"
  - date: "2026-09-22"
    provider: "Anthropic"
    service: "Claude Opus 5.5"
    change: "Claude Opus 5.5 launches at 0.8x the Opus 5 rate, with cache reads at 0.05x input, half the standard multiplier. It is the first break in the Opus list rate in five generations, so moving a cache-heavy workload from Opus 5 is a rate cut."
    file: "finops-anthropic"
    section: "Base token pricing: tiers and ratios"
    source: "https://platform.claude.com/docs/en/about-claude/pricing"
  - date: "2026-09-18"
    provider: "AWS"
    service: "Amazon Bedrock (Kimi K3)"
    change: "Kimi K3 is on Amazon Bedrock, the first open-weight model there with explicit prompt caching. Bedrock bills one 30-minute cache write at 1.25x input next to the 0.1x read, while Moonshot direct bills writes by TTL (1x for 5 minutes, 2x for 1 hour)."
    file: "finops-open-weight-vendors"
    section: "Kimi (Moonshot): the proof that open weight does not imply cheap"
  - date: "2026-09-16"
    provider: "Snowflake"
    service: "Cortex AI per-user quotas"
    change: "Per-user quotas gain a weekly limit, generally available, alongside daily and monthly cycles. It follows the ISO week and resets on Monday at 00:00 UTC; with block enforcement on, a user is blocked on reaching any of the limits."
    file: "finops-snowflake"
    section: "Cortex AI cost governance"
    source: "https://docs.snowflake.com/en/release-notes/2026/other/2026-09-16-weekly-per-user-quota-limits"
  - date: "2026-09-15"
    provider: "AWS"
    service: "Billing Conductor"
    change: "SKU-scoped pricing rules can carry a custom absolute rate and custom usage-tier thresholds, not only a mark-up or mark-down on public on-demand rates. A reseller or central IT team can mirror a negotiated or internal rate card in the pro forma view; the AWS invoice is unchanged."
    file: "finops-aws-billing"
    section: "The four mechanisms"
    source: "https://aws.amazon.com/about-aws/whats-new/2026/09/AWS-Billing-Conductor-custom-rates-usage-tier/"
  - date: "2026-09-15"
    provider: "Snowflake"
    service: "Cortex AI Gateway"
    change: "Cortex AI Gateway enters public preview: a governed endpoint for applications and third-party agents to reach models. Consumption is recorded per request (gateway, user, model, tokens) in ACCOUNT_USAGE.AI_GATEWAY_USAGE_HISTORY, the attribution source for showback."
    file: "finops-snowflake"
    section: "Cortex AI cost governance"
    source: "https://docs.snowflake.com/en/release-notes/2026/other/2026-09-15-cortex-ai-gateway"
  - date: "2026-09-10"
    provider: "AWS"
    service: "AWS FinOps Agent"
    change: "AWS FinOps Agent enters public preview, with a four-tier autonomy ladder from read-only insights to bounded autonomy. Autonomy is granted per action type, and the top tier is still capped by a maximum financial impact."
    file: "finops-agentic"
    section: "Agentic cost anatomy - where the tokens go"
  - date: "2026-09-09"
    provider: "AWS"
    service: "Lambda Managed Instances"
    change: "Lambda Managed Instances, which bills through EC2 pricing, supports Graviton5 C9g, C9gd, M9g and M9gd instances. AWS states up to 25% better compute performance than Graviton4, a performance claim and not a price cut; a capacity provider pinned to an older instance type does not move on its own."
    file: "finops-aws-patterns-compute"
    section: "Compute Optimization Patterns (42)"
    source: "https://aws.amazon.com/about-aws/whats-new/2026/09/aws-lambda-graviton5-ec2/"
  - date: "2026-09-03"
    provider: "AWS"
    service: "CloudFront"
    change: "Flat-rate plan subscription, upgrade, downgrade and cancellation can be managed through the CLI, SDKs, CloudFormation, CDK or the PricingPlanManager API, no longer console-only. Paid plans support a two-phase flow: create the plan, then approve it to start billing."
    file: "finops-aws"
    section: "Operational gotchas"
    source: "https://aws.amazon.com/about-aws/whats-new/2026/09/cloudfront-flat-rate-pricing-plans-api/"
  - date: "2026-09-01"
    provider: "Anthropic"
    service: "Claude Sonnet 5"
    change: "Anthropic cancelled in August 2026 the 50% increase scheduled for Sonnet 5 on 1 September 2026: the introductory rate is now the standard rate. Budgets built on it stay valid, and Sonnet 5 sits at 0.4x the Opus 5 rate instead of 0.6x."
    file: "finops-anthropic"
    section: "Base token pricing: tiers and ratios"
    source: "https://platform.claude.com/docs/en/about-claude/pricing"
  - date: "2026-09"
    provider: "Google Cloud"
    service: "Cloud Billing"
    change: "The Cloud Billing console has an Incentives page tracking conditional contract credits: spend-based milestone credits, Incremental Workload Credits and RaMP incentives, each with end date, spend target, progress and status. The tracker lags by up to three days."
    file: "finops-gcp"
    section: "Incentives page - tracking conditional contract credits"
    source: "https://docs.cloud.google.com/billing/docs/how-to/incentives-program-tracker"
  - date: "2026-09"
    provider: "Databricks"
    service: "AI Gateway external models"
    change: "A price multiplier can be set on an external model provider service so Databricks spend estimates reflect a negotiated discount instead of list rates. It applies only to requests made after it is set, and not to Databricks-hosted partner models."
    file: "finops-databricks"
    section: "Model serving attribution"
    source: "https://docs.databricks.com/aws/en/ai-gateway/create-model-provider-services"
  - date: "2026-09"
    provider: "Databricks"
    service: "SQL warehouses"
    change: "system.query.history and query tags are generally available. Clients of a shared SQL warehouse can tag each query, so the warehouse's DBUs can be split by team pro rata to query execution time, as an apportionment and not a metered figure."
    file: "finops-databricks"
    section: "Query-level attribution on SQL warehouses"
    source: "https://docs.databricks.com/aws/en/release-notes/product/2026/september"
  - date: "2026-08-31"
    provider: "Google Cloud"
    service: "BigQuery"
    change: "BigQuery restored daily token quotas for its Gemini-based generative AI functions (embedding functions excluded), per project and per user. The defaults are very high, so the quota caps spend only once a stricter override is set."
    file: "finops-gcp"
    section: "BigQuery commitments (separate from Compute CUDs)"
    source: "https://docs.cloud.google.com/bigquery/docs/release-notes#August_31_2026"
  - date: "2026-08-28"
    provider: "Anthropic"
    service: "Claude Code"
    change: "Claude Code v2.1.251 adds a per-session prompt-cache line to /cost (hit ratio, misses, tokens re-cached) and, behind a self-hosted gateway with spend limits, a spend-limit bar in /usage shown as a share of the cap. Console, Team and Enterprise users do not see the bar."
    file: "finops-ai-dev-tools"
    section: "Cost tracking for Claude Code"
    source: "https://github.com/anthropics/claude-code/blob/main/CHANGELOG.md"
  - date: "2026-08-26"
    provider: "Google Cloud"
    service: "Gemini Enterprise"
    change: "Google announced a Pay-as-you-go edition beside the per-seat editions: no base subscription fee, usage billed at standard model API rates, no feature quota limits. At announcement it was open to select customers on invoiced Cloud Billing accounts only."
    file: "finops-gcp"
    section: "AI Cost Summary Agent - native AI spend visibility"
    source: "https://cloud.google.com/blog/products/ai-machine-learning/flexible-billing-and-cost-controls-for-agents-on-google-cloud"
  - date: "2026-08-26"
    provider: "Google Cloud"
    service: "Gemini Enterprise Flexible Savings Plans"
    change: "Google announced Flexible Savings Plans: spend-based commitments on generative AI consumption, 10% off for 1 year and 20% for 3 years, no minimum or maximum. Provisioned Throughput and seat subscriptions draw down the plan but earn no incremental discount."
    file: "finops-vertexai"
    section: "Flexible Savings Plans (FSPs) - commitment discounts on token spend"
    source: "https://docs.cloud.google.com/docs/cuds-flexible-savings-plans"
  - date: "2026-08-25"
    provider: "Azure"
    service: "Azure Resource Manager MCP server"
    change: "The Azure Resource Manager MCP server (preview) gains Cost Management and Pricing tools, on by default: cost queries, AKS cost by cluster and namespace, retail prices and price sheet download. Forecasts, budgets, alerts and reservation insights sit in an optional toolset."
    file: "finops-tagging"
    section: "MCP-based tagging automation"
    source: "https://techcommunity.microsoft.com/blog/finopsblog/cost-management-with-azure-resource-manager-mcp/4550182"
  - date: "2026-08-19"
    provider: "AWS"
    service: "Cost Anomaly Detection (Bedrock)"
    change: "AWS Cost Anomaly Detection monitors spend on third-party foundation models on Bedrock through the AWS services managed monitor, with no setup. Anomalies come with a root-cause breakdown ranked by dollar impact across service, account, Region and usage type."
    file: "finops-bedrock"
    section: "Cost Anomaly Detection for Bedrock foundation models"
    source: "https://aws.amazon.com/about-aws/whats-new/2026/08/aws-cost-anomaly-detection-bedrock-3P/"
  - date: "2026-08-16"
    provider: "DeepSeek"
    service: "DeepSeek V4 API"
    change: "DeepSeek introduced peak and off-peak rates with the V4 line: peak hours (seven per weekday) cost exactly 2x off-peak on input and output. The flat rate was replaced by a higher peak rate, so the repricing raised the rate card: do not model off-peak as a saving."
    file: "finops-open-weight-vendors"
    section: "DeepSeek: time-of-day pricing"
  - date: "2026-08-13"
    provider: "Google Cloud"
    service: "Vertex AI Provisioned Throughput"
    change: "From 13 August to 31 December 2026 Google issues a monthly billing credit equal to 50% of net eligible Provisioned Throughput spend on Gemini 3.8, 3.7 and 3.6 Flash. The credit is issued on the 7th of the following month and expires 30 days after issuance."
    file: "finops-vertexai"
    section: "Introductory pricing on the 3.x Flash SKUs - a dated forecasting item"
    source: "https://cloud.google.com/gemini-enterprise-agent-platform/generative-ai/pricing"
  - date: "2026-08"
    provider: "AWS"
    service: "Billing and Cost Management"
    change: "Billing and Cost Management offers five Managed Dashboards (Cost Overview, Trends, Compute, Database, Reservations and Savings Plans), pre-populated with account data at no additional cost and with no setup. They are read-only, can be duplicated into editable copies and export to PDF or CSV."
    file: "finops-aws-billing"
    section: "AWS Managed Dashboards (zero-setup native visibility)"
    source: "https://aws.amazon.com/about-aws/whats-new/2026/08/aws-billing-and-cost-management-managed-dashboards/"
  - date: "2026-08"
    provider: "AWS"
    service: "Bedrock IAM Principal Cost Allocation"
    change: "IAM Principal Cost Allocation covers inference on the bedrock-mantle endpoint as well as bedrock-runtime, with no additional setup once caller-identity allocation is enabled. Caller-based cost attribution in CUR 2.0 and Cost Explorer now reaches inference routed through bedrock-mantle."
    file: "finops-bedrock"
    section: "Tagging strategy for Bedrock"
    source: "https://docs.aws.amazon.com/bedrock/latest/userguide/cost-mgmt-iam-principal-tracking.html"
  - date: "2026-08"
    provider: "AWS"
    service: "Bedrock AgentCore"
    change: "AgentCore memory, policy and the managed harness are available in AWS GovCloud (US-West). The managed harness bundles compute, environment and observability into API calls, a new cost surface to attribute; GovCloud rates commonly differ from commercial-Region rates."
    file: "finops-bedrock"
    section: "AgentCore in GovCloud - regulated-workload cost governance"
  - date: "2026-08"
    provider: "Google Cloud"
    service: "Flexible committed use discounts"
    change: "Flexible GPU commitments can apply across services, not only within a single service. A team commits to GPU spend once and the discount applies across qualifying services, so the commitment holds up better when AI workloads move."
    file: "finops-gcp"
    section: "Committed Use Discounts (CUDs) - resource-based vs spend-based"
    source: "https://cloud.google.com/compute/docs/instances/signing-up-flexible-committed-use-discounts"
  - date: "2026-08"
    provider: "Google Cloud"
    service: "Cloud Billing Reports"
    change: "Billing Reports add an Originating products filter and group-by dimension and a Gemini Enterprise preset report, for native attribution of AI consumption. It is console only: the field is not in the BigQuery billing export."
    file: "finops-vertexai"
    section: "GCP Billing and BigQuery export"
    source: "https://docs.cloud.google.com/billing/docs/how-to/reports/gemini-enterprise-costs"
