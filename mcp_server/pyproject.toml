[build-system]
# Upper-bounded for the same reason the runtime deps are: an unbounded
# dependency is how the mcp 2.0 breakage reached a published wheel.
# hatch-build-scripts is a third-party 0.0.x plugin, so any release could
# be breaking - pin to the 0.0.x line.
# hatchling floor is 1.27: the first release that understands the PEP 639
# `license = "<SPDX expression>"` form this project declares.
requires = ["hatchling>=1.27,<2", "hatch-build-scripts>=0.0.4,<0.1"]
build-backend = "hatchling.build"

[project]
name = "cloud-finops-mcp"
version = "1.35.0"
description = "MCP server exposing the OptimNow Cloud FinOps skill (reference library + named-pattern playbooks) as queryable tools."
readme = "README.md"
# PEP 639 SPDX expression. The old `License :: OSI Approved` classifier was
# wrong twice over: CC BY-SA 4.0 is not an OSI-approved licence, and bare
# License classifiers are deprecated in favour of this field.
license = "CC-BY-SA-4.0"
authors = [
  { name = "OptimNow", email = "contact@optimnow.io" }
]
maintainers = [
  { name = "Jean Latière", email = "jean@optimnow.io" }
]
requires-python = ">=3.10"
keywords = [
  "finops",
  "cloud",
  "cost",
  "cost-optimization",
  "mcp",
  "model-context-protocol",
  "claude",
  "aws",
  "azure",
  "gcp",
  "kubernetes",
  "llm",
  "ai-cost",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Intended Audience :: Information Technology",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
  "mcp>=1.28,<2",
  "pyyaml>=6.0,<7",
]

[project.optional-dependencies]
dev = [
  "pytest>=7.4",
  "pytest-asyncio>=0.23",
  "ruff>=0.5",
]

[project.urls]
Homepage = "https://github.com/OptimNow/cloud-finops-skills"
Repository = "https://github.com/OptimNow/cloud-finops-skills"
Issues = "https://github.com/OptimNow/cloud-finops-skills/issues"
Documentation = "https://github.com/OptimNow/cloud-finops-skills/tree/main/mcp_server"
Changelog = "https://github.com/OptimNow/cloud-finops-skills/releases"

[project.scripts]
cloud-finops-mcp = "cloud_finops_mcp.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/cloud_finops_mcp"]
# .md files in src/cloud_finops_mcp/data/ are gitignored but live in the
# package directory; hatch picks them up via the package walk, no
# force-include needed.

[tool.hatch.build.targets.sdist]
include = [
  "src/cloud_finops_mcp",
  "scripts",
  "tests",
  "README.md",
  "pyproject.toml",
]
# Force-include the synced reference bundle so the sdist is self-contained -
# without this, hatch respects ../../.gitignore and drops src/.../data/*.md.
[tool.hatch.build.targets.sdist.force-include]
"src/cloud_finops_mcp/data" = "src/cloud_finops_mcp/data"

[[tool.hatch.build.hooks.build-scripts.scripts]]
out_dir = "src/cloud_finops_mcp/data"
commands = ["python scripts/sync_references.py"]
artifacts = []

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
# Force pytest to import from the local src/ tree, not whatever
# `cloud_finops_mcp` happens to be installed in site-packages. Without
# this, a stale `pip install` of the package would silently mask drift
# between the test assertions and this checkout. See Codex review
# (2026-05-15) for the failure mode this prevents.
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP"]
ignore = ["E501"]
