    unit: USD per CU per year, 1-year reservation, West Europe
    query:
      filter: serviceName eq 'Microsoft Fabric' and armRegionName eq 'westeurope' and priceType eq 'Reservation' and skuName eq 'Fabric Capacity'
      reservation_term: 1 Year
  azure-fabric-reservation-3y-westeurope:
