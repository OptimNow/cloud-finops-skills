  azure-fabric-cu-hour-westeurope:
    provider: azure
    unit: USD per CU-hour, pay-as-you-go, West Europe
    note: The API prices the F SKU per workload meter and every "Capacity Usage" meter carries the same CU-hour rate; Data Warehouse stands for the capacity.
    query:
      filter: serviceName eq 'Microsoft Fabric' and armRegionName eq 'westeurope' and priceType eq 'Consumption' and productName eq 'Fabric Capacity' and skuName eq 'Data Warehouse Capacity Usage'
  azure-fabric-reservation-1y-westeurope:
