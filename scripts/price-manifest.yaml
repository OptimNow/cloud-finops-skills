    unit: USD per GB-month
    query:
      service_code: AmazonS3
      filters: {usagetype: TimedStorage-INT-IA-ByteHrs, location: US East (N. Virginia)}
  aws-s3-files-storage-gb-month:
    provider: aws
    unit: USD per GB-month, hot tier
    query:
      service_code: AmazonS3
      filters: {usagetype: USE1-Files-TimedStorage-ByteHrs, location: US East (N. Virginia)}
  aws-s3-files-read-gb:
