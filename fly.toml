# Fly.io app for the hosted connector. The release workflow deploys it from each
# tag (the `deploy-hosted` job of auto-tag-on-plugin-bump.yml; deploy-hosted.yml
# redeploys one tag by hand). `fly deploy` from the repo root does the same from
# a laptop: it builds the Dockerfile and rolls the app. The public URL is
# https://mcp.optimnow.io/mcp (custom domain: a CNAME to cloud-finops-mcp.fly.dev
# plus a certificate issued with `fly certs add`; the docs name that URL and no
# other). The cloud-finops-mcp.fly.dev host still answers but is deprecated.
#
# Scale-to-zero: the machine suspends when idle and resumes on the next request,
# so a quiet month costs only the root filesystem (Fly bills a stopped or suspended
# machine the same way). Resuming from suspend takes a few hundred milliseconds,
# against about 2 seconds or more from a stop (docs.fly.io/launch/autostop-autostart,
# read 2026-11-08). Suspend needs at most 2 GB of memory, no swap and no schedule;
# a deploy or host migration discards the snapshot, so the next start is a cold one.

app = "cloud-finops-mcp"
primary_region = "cdg"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8080"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "suspend"
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
