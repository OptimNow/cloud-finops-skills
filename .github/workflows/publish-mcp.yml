name: Publish cloud-finops-mcp to PyPI

on:
  # Manual tag pushes from a developer machine (git push v1.x.y) trigger
  # this workflow normally - GitHub only blocks recursive triggers from
  # GITHUB_TOKEN, not from PATs or developer machines.
  push:
    tags:
      - 'v*'
  # Manual recovery path: if auto-tag-on-plugin-bump.yml's inline publish
  # job fails for any reason, you can re-publish a previously-tagged version
  # by running `gh workflow run publish-mcp.yml -f tag=v1.x.y` (or via the
  # Actions UI). The 2026-05-15 PyPI publish failure was the immediate
  # motivator for this entry.
  workflow_dispatch:
    inputs:
      tag:
        required: true
        type: string
        description: 'Tag to publish, e.g. v1.22.1'

# Trusted publishing via OIDC. No PyPI API token in repo secrets.
# One-time setup: in PyPI project settings for "cloud-finops-mcp", this repo
# (OptimNow/cloud-finops-skills) is registered as a trusted publisher with
# workflow filename "publish-mcp.yml" and environment "pypi". A SECOND
# trusted-publisher entry exists for "auto-tag-on-plugin-bump.yml" so the
# inline publish job in that workflow can also publish on plugin.json bumps.
# Reusable-workflow (workflow_call) invocation is NOT used here because PyPI's
# trusted publishing does not support reusable workflows
# (https://docs.pypi.org/trusted-publishers/troubleshooting/#reusable-workflows-on-github).

permissions:
  contents: read
  id-token: write  # required for PyPI trusted publishing (OIDC)

jobs:
  # Normalise and validate the dispatch input before anything tries to use it.
  #
  # Git refs are case sensitive. A dispatch with `V1.28.1` instead of
  # `v1.28.1` used to reach actions/checkout unchanged, which then spent three
  # minutes retrying a fetch for a ref that does not exist and gave up with
  # "The process '/usr/bin/git' failed with exit code 1" - a message that names
  # neither the tag nor the reason. It also broke the version derivation below,
  # since `${TAG#v}` does not strip a capital V, so a run that survived
  # checkout would have pinned the package to version "V1.28.1".
  #
  # Failing here instead costs seconds and says which tag was not found.
  resolve-tag:
    name: Resolve and validate the tag
    runs-on: ubuntu-latest
    outputs:
      ref: ${{ steps.resolve.outputs.ref }}
    steps:
      - name: Resolve tag
        id: resolve
        env:
          INPUT_TAG: ${{ inputs.tag }}
          FALLBACK_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          if [[ -z "${INPUT_TAG}" ]]; then
            # push:tags path - github.ref is already refs/tags/<tag>.
            echo "ref=${FALLBACK_REF}" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          tag="${INPUT_TAG}"
          tag="${tag#V}"          # tolerate a capitalised prefix
          tag="${tag#v}"
          tag="v${tag}"           # and a missing one
          if [[ "$tag" != "${INPUT_TAG}" ]]; then
            echo "::notice::normalised tag input '${INPUT_TAG}' to '${tag}'"
          fi

          # Public repo, so an unauthenticated ls-remote is enough and avoids
          # a full checkout just to answer "does this tag exist".
          if ! git ls-remote --exit-code --tags \
               "https://github.com/${GITHUB_REPOSITORY}" "refs/tags/${tag}" >/dev/null 2>&1; then
            echo "::error::tag ${tag} does not exist in ${GITHUB_REPOSITORY}. Check the Releases page for the exact tag name; refs are case sensitive."
            exit 1
          fi
          echo "Resolved to ${tag}"
          echo "ref=${tag}" >> "$GITHUB_OUTPUT"

  build:
    name: Build wheel + sdist
    needs: resolve-tag
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          # Always the resolved ref from the job above: refs/tags/<tag> on a
          # push, the normalised and existence-checked tag on a dispatch.
          ref: ${{ needs.resolve-tag.outputs.ref }}

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: '3.12'

      - name: Resolve version from tag
        id: version
        env:
          RESOLVED_REF: ${{ needs.resolve-tag.outputs.ref }}
        run: |
          # One source of truth for both triggers. Strips a refs/tags/ prefix
          # on the push path and is a bare tag already on the dispatch path,
          # so the capitalisation bug cannot reappear here either.
          TAG="${RESOLVED_REF##*/}"
          VERSION="${TAG#v}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Building cloud-finops-mcp ${VERSION} from tag ${TAG}"

      - name: Pin pyproject version to tag
        working-directory: mcp_server
        run: |
          # Replace the pyproject version line with the git tag (minus the leading 'v')
          # so wheel filename and PyPI metadata always match the release.
          python - <<'PY'
          import os, pathlib, re
          version = os.environ["VERSION"]
          path = pathlib.Path("pyproject.toml")
          text = path.read_text(encoding="utf-8")
          new = re.sub(r'^version = ".*"', f'version = "{version}"', text, count=1, flags=re.M)
          path.write_text(new, encoding="utf-8")
          print(f"pyproject.toml version pinned to {version}")
          PY
        env:
          VERSION: ${{ steps.version.outputs.version }}

      - name: Sync references into bundled data/
        working-directory: mcp_server
        run: python scripts/sync_references.py

      - name: Install build tooling
        run: python -m pip install --upgrade pip build

      - name: Build sdist + wheel
        working-directory: mcp_server
        run: python -m build

      - name: Inspect built artefacts
        run: ls -lh mcp_server/dist/

      - name: Upload artefacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: pypi-dist
          path: mcp_server/dist/
          # Inter-job plumbing only; the durable copy is on PyPI. Default
          # retention is 90 days, which is far longer than this artifact's
          # value (zero once the publish job succeeds).
          retention-days: 7

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/cloud-finops-mcp
    steps:
      - name: Download artefacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4.3.0
        with:
          name: pypi-dist
          path: dist/

      # Pinned at v1.14.2, not v1.14.0. hatchling (pinned `>=1.18,<2`, so it
      # floats within the major) now emits `Metadata-Version: 2.5`, and the
      # twine bundled in v1.14.0 rejects it outright:
      #   InvalidDistribution: '2.5' is not a valid metadata version
      # That broke the 1.28.1 publish on 2026-08-16 after the tag, the GitHub
      # Release and the wheel build had all succeeded. v1.14.2 ships twine 7,
      # which accepts metadata 2.5. Both this workflow and its counterpart must
      # move together - they are duplicated on purpose (see the comment above
      # the build job) and a fix applied to only one leaves the other broken.
      - name: Publish via trusted publishing
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33  # v1.14.2
        with:
          packages-dir: dist/
