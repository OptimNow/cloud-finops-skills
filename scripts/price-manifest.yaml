# price-manifest.yaml - every static list price the skill carries, and where it is written.
#
# Read by scripts/check-prices.py: live every Saturday in .github/workflows/price-drift.yml,
# and with --offline in CI against the recorded fixtures in scripts/fixtures/prices/. The
# rule behind it is "Write mechanics, not price figures" (docs/DESIGN.md, "Content rules");
# how to maintain it is under "Price drift check" in the "Content update pipeline" section.
#
# Two sections.
#
# prices:  one entry per provider SKU, named <provider>-<what>-<unit>. `query` is what the
#          script sends to the provider's own price list:
#            aws    service_code and filters (TERM_MATCH on Price List attributes); optional
#                   begin_range (the tier to read when a price has several, default "0") and
#                   term (OnDemand by default, FlatRate for the CloudFront plans)
#            azure  filter, the OData $filter of the Retail Prices API; optional
#                   reservation_term ("1 Year", "3 Years") when priceType is Reservation
#            gcp    catalog (service, description, optional region and start_usage_amount),
#                   read with GOOGLE_API_KEY, and/or page (url, regex with one capturing
#                   group), read without a key; each block takes an optional unit_factor
#                   that brings the fetched value to the unit named here
#          Several matching rows are fine when they carry one price (the 29 RDS backup rows,
#          the two peering directions); zero-priced rows are dropped when a priced row exists
#          (a free first tier, a Capacity Block placeholder); several distinct prices fail the
#          query, which tells the author to tighten it.
#
# figures: one entry per place a number is written. `file` is the repository path, `anchor` a
#          substring found on exactly one line of that file, `figure` the number as written
#          after the $ sign ("4,140", not 4140), `price` the entry it comes from, `derivation`
#          the arithmetic from the live rate when the text carries a monthly or per-TB figure
#          (`rate`, `other` for a second price named in `other:`, digits and + - * / only; 730
#          hours a month, 1,000 GB a TB), `tolerance` the relative gap accepted (0.02 by
#          default, raised only where the text rounds harder and says so with "~" or
#          "roughly"). A figure edited in a file without its entry here fails the CI run.
#
#          A figure no API serves (a Snowflake tier read from a PDF) is written with
#          `source: page` in place of `price`: `url` (where it was read), `read_on` (the date
#          the file says it was read, YYYY-MM-DD) and `max_age_days` (90 by default). The
#          script never fetches it; a live run lists it under "Check by hand" once it is
#          older than max_age_days, with its file, line, figure and URL, and exits 1 so the
#          weekly issue carries the reminder. The offline CI run checks its anchor only.
#
# Left out on purpose: scale examples that are not prices (the "$50/month" instance of the
# schedule-blindness arithmetic, "a $50K/month anomaly"), ranges ("$5-15/month per warm
# instance", Azure SQL serverless "~$15/month"), seat and token prices (routed to the AI
# Pricing Hub), Snowflake and Cloudflare list prices (no provider price API), EFS throughput
# read and write rates quoted beside the S3 Files rates, and figures that are policy rather
# than price (the Azure reservation refund cap).

prices:

  # ---- AWS: Price List API, us-east-1 ------------------------------------------------------

  aws-nat-gateway-hour:
    provider: aws
    unit: USD per hour
    query:
      service_code: AmazonEC2
      filters: {usagetype: NatGateway-Hours, location: US East (N. Virginia)}
  aws-nat-gateway-gb:
    provider: aws
    unit: USD per GB processed
    query:
      service_code: AmazonEC2
      filters: {usagetype: NatGateway-Bytes, location: US East (N. Virginia)}
  aws-vpc-interface-endpoint-hour:
    provider: aws
    unit: USD per endpoint-hour per AZ
    query:
      service_code: AmazonVPC
      filters: {usagetype: USE1-VpcEndpoint-Hours, location: US East (N. Virginia)}
  aws-public-ipv4-hour:
    provider: aws
    unit: USD per address-hour
    query:
      service_code: AmazonVPC
      filters: {usagetype: 'USE1-PublicIPv4:InUseAddress', location: US East (N. Virginia)}
  aws-alb-hour:
    provider: aws
    unit: USD per hour
    query:
      service_code: AWSELB
      filters: {usagetype: LoadBalancerUsage, operation: 'LoadBalancing:Application', location: US East (N. Virginia)}
  aws-ec2-cross-az-gb:
    provider: aws
    unit: USD per GB, each direction
    query:
      service_code: AWSDataTransfer
      filters: {usagetype: DataTransfer-Regional-Bytes, fromLocation: US East (N. Virginia)}
  aws-ec2-transfer-out-internet-gb:
    provider: aws
    unit: USD per GB, first 10 TB tier
    note: The first tier after the free 100 GB; begin_range "0" reads the 0-10240 GB dimension.
    query:
      service_code: AWSDataTransfer
      filters: {usagetype: DataTransfer-Out-Bytes, fromLocation: US East (N. Virginia), toLocation: External}
      begin_range: "0"
  aws-cloudfront-us-transfer-out-gb:
    provider: aws
    unit: USD per GB, first 10 TB tier, North America
    query:
      service_code: AmazonCloudFront
      filters: {usagetype: US-DataTransfer-Out-Bytes}
      begin_range: "0"
  aws-cloudfront-plan-pro-month:
    provider: aws
    unit: USD per month
    query:
      service_code: CloudFrontPlans
      filters: {usagetype: Global-CloudFrontPlan-Pro}
      term: FlatRate
  aws-cloudfront-plan-business-month:
    provider: aws
    unit: USD per month
    query:
      service_code: CloudFrontPlans
      filters: {usagetype: Global-CloudFrontPlan-Business}
      term: FlatRate
  aws-cloudfront-plan-premium-month:
    provider: aws
    unit: USD per month
    query:
      service_code: CloudFrontPlans
      filters: {usagetype: Global-CloudFrontPlan-Premium}
      term: FlatRate
  aws-waf-rule-month:
    provider: aws
    unit: USD per rule-month
    query:
      service_code: awswaf
      filters: {usagetype: USE1-Rule, location: US East (N. Virginia)}
  aws-cost-explorer-api-request:
    provider: aws
    unit: USD per API request
    query:
      service_code: AWSCostExplorer
      filters: {usagetype: USE1-APIRequest}
  aws-ebs-gp3-gb-month:
    provider: aws
    unit: USD per GB-month
    query:
      service_code: AmazonEC2
      filters: {usagetype: 'EBS:VolumeUsage.gp3', location: US East (N. Virginia)}
  aws-ebs-gp2-gb-month:
    provider: aws
    unit: USD per GB-month
    query:
      service_code: AmazonEC2
      filters: {usagetype: 'EBS:VolumeUsage.gp2', location: US East (N. Virginia)}
  aws-ebs-io2-gb-month:
    provider: aws
    unit: USD per GB-month
    query:
      service_code: AmazonEC2
      filters: {usagetype: 'EBS:VolumeUsage.io2', location: US East (N. Virginia)}
  aws-ebs-snapshot-gb-month:
    provider: aws
    unit: USD per GB-month, Standard tier
    query:
      service_code: AmazonEC2
      filters: {usagetype: 'EBS:SnapshotUsage', location: US East (N. Virginia)}
  aws-rds-backup-storage-gb-month:
    provider: aws
    unit: USD per GB-month above the free allowance
    note: One row per engine, all at the same rate; the script accepts that.
    query:
      service_code: AmazonRDS
      filters: {usagetype: 'RDS:ChargedBackupUsage', location: US East (N. Virginia)}

  # EC2 on-demand, Linux, shared tenancy. operation RunInstances keeps the Capacity Block
  # placeholder rows ($0.00) out of the P-family results.
  aws-ec2-g4dn-xlarge-hour:
    provider: aws
    unit: USD per hour
    query:
      service_code: AmazonEC2
      filters: &ec2 {instanceType: g4dn.xlarge, operatingSystem: Linux, tenancy: Shared, preInstalledSw: NA, capacitystatus: Used, operation: RunInstances, location: US East (N. Virginia)}
  aws-ec2-c7i-xlarge-hour:
    provider: aws
    unit: USD per hour
    query:
      service_code: AmazonEC2
      filters: {<<: *ec2, instanceType: c7i.xlarge}
  aws-ec2-g5-4xlarge-hour:
    provider: aws
    unit: USD per hour
    query:
      service_code: AmazonEC2
      filters: {<<: *ec2, instanceType: g5.4xlarge}
  aws-ec2-c7i-4xlarge-hour:
    provider: aws
    unit: USD per hour
    query:
