<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Playbook viewer</title>
<!--THEME_CSS-->
<style>
  #root { padding: 16px 18px 28px; max-width: 780px; margin: 0 auto; }
  .empty { border: none; background: none; }
</style>
</head>
<body>
<div id="root">
  <div class="state" id="empty-state">
    <div class="spinner"></div>
    Waiting for playbook data&hellip;
  </div>
  <div class="panel-loading hidden" id="nav-loading">Loading&hellip;</div>
  <div id="content"></div>
</div>

<!--BRIDGE-->
<!--PLAYBOOK_RENDER-->
<!--WIDGET_COMMON-->
<script>
(function () {
  "use strict";
  var R = window.PlaybookRender;
  var W = window.WidgetCommon;

  function render(payload) {
    var emptyState = W.$("empty-state");
    if (emptyState) emptyState.classList.add("hidden");
    W.hide(W.$("nav-loading"));

    var content = W.$("content");

    if (payload && payload.error) {
      // First-render errors only: navigation errors are handled
      // non-destructively in openPlaybook and never reach here.
      content.textContent = "";
      var err = document.createElement("div");
      err.className = "error";
      err.textContent = "No playbook loaded: " + R.errorText(payload);
      content.appendChild(err);
      return;
    }

    if (!payload || typeof payload.content !== "string") {
      content.innerHTML = '<div class="error">Unexpected tool result shape - no content string found.</div>';
      return;
    }

    content.innerHTML =
      R.renderPlaybookHtml(payload, { checklistFix: true }) +
      '<div class="brand-note"><a href="https://optimnow.io">OptimNow</a></div>';

    // v2 enhancements: Copy on every code block; `playbooks/<slug>.md`
    // entries in See also navigate to that playbook via the host bridge.
    R.enhanceCodeBlocks(content);
    R.enhanceSeeAlso(content, openPlaybook);
  }

  /* Show a transient, NON-destructive note above the current playbook.
   * Used for every navigation failure - a See-also click that misses
   * (renamed slug, host error) must never wipe what the user is reading. */
  function transientNote(message) {
    var content = W.$("content");
    var note = document.createElement("div");
    note.className = "error";
    note.textContent = message;
    content.insertBefore(note, content.firstChild);
    setTimeout(function () { if (note.parentNode) note.parentNode.removeChild(note); }, 6000);
  }

  function openPlaybook(slug) {
    var token = W.nextToken();
    W.show(W.$("nav-loading"));
    window.McpBridge.callTool("get_playbook", { name: slug }).then(function (payload) {
      if (!W.isCurrent(token)) return; // a newer interaction superseded this
      W.hide(W.$("nav-loading"));
      if (payload.error) {
        transientNote("Could not open playbooks/" + slug + ".md: " + R.errorText(payload));
        return;
      }
      render(payload);
    }, function (err) {
      if (!W.isCurrent(token)) return;
      W.hide(W.$("nav-loading"));
      transientNote("Could not open playbooks/" + slug + ".md: " + String(err && err.message || err));
    });
  }

  // External links are routed through the host's ui/open-link by the
  // shared bridge's document-level click handler - no per-widget copy.

  window.McpBridge.init({
    appName: "cloud-finops-playbook-viewer",
    onToolResult: render
  });
})();
</script>
</body>
</html>
