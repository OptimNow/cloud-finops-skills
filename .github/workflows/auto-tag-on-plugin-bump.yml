name: Auto-tag and release on plugin.json bump

# When a push to main changes .claude-plugin/plugin.json, read the version
# field, create a matching v<version> tag (if one does not already exist),
# build the cloud-finops-v<version>.zip artefact, and create the GitHub
# Release with the zip attached.
#
# Why we don't just push the tag and let release.yml fire:
# GitHub blocks workflows triggered by GITHUB_TOKEN events to prevent
# recursive loops. When this workflow pushes the tag, release.yml's
# `push: tags` trigger is silently ignored, so the release would never
# be created. Building the release here keeps the chain in one job.
# release.yml still exists as a fallback for tags pushed manually
# (gh release create / git push v1.x.y from a developer machine).
#
# This closes the failure mode the cloud-finops-skills repo hit between
# v1.12 and v1.20.0: the plugin.json version was bumped through several PRs
# (1.13, 1.14, ..., 1.19) without anyone manually tagging, so release.yml
# never fired and the latest release zip drifted weeks behind main.

on:
  push:
    branches: [main]
    paths:
      - '.claude-plugin/plugin.json'

permissions:
  contents: write   # required to push the new tag and create the release

jobs:
  # Runs BEFORE anything is created. On 2026-08-16 the 1.28.1 release pushed a
  # tag, cut a GitHub Release and built a wheel, and only then discovered that
  # twine refused the wheel's metadata version. The tag and Release were left
  # pointing at something that had never been publishable, and the only way
  # forward was a manual recovery dispatch.
  #
  # Building and running `twine check --strict` here costs about thirty
  # seconds and moves that class of failure to before the first irreversible
  # side effect. The build is deliberately duplicated rather than shared with
  # build-mcp: sharing it would mean tagging first to have a ref to check out,
  # which is exactly the ordering this job exists to avoid.
  verify-package:
    name: Verify the wheel is publishable
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout pushed commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: '3.12'

      - name: Pin pyproject version to plugin.json
        working-directory: mcp_server
        run: |
          set -euo pipefail
          version=$(jq -r '.version' ../.claude-plugin/plugin.json)
          VERSION="$version" python - <<'PY'
          import os, pathlib, re
          version = os.environ["VERSION"]
          path = pathlib.Path("pyproject.toml")
          text = path.read_text(encoding="utf-8")
          new = re.sub(r'^version = ".*"', f'version = "{version}"', text, count=1, flags=re.M)
          path.write_text(new, encoding="utf-8")
          print(f"pyproject.toml version pinned to {version}")
          PY

      - name: Sync references into bundled data/
        working-directory: mcp_server
        run: python scripts/sync_references.py

      - name: Install build tooling
        run: python -m pip install --upgrade pip build twine

      - name: Build sdist + wheel
        working-directory: mcp_server
        run: python -m build

      - name: Check the artefacts the way PyPI will
        working-directory: mcp_server
        run: |
          set -euo pipefail
          python -m twine check --strict dist/*
          echo "--- metadata version actually emitted ---"
          python - <<'PY'
          import glob, zipfile
          wheel = glob.glob("dist/*.whl")[0]
          with zipfile.ZipFile(wheel) as z:
              name = next(n for n in z.namelist() if n.endswith("METADATA"))
              print(z.read(name).decode().splitlines()[0])
          PY

  tag-and-release:
    needs: verify-package
    runs-on: ubuntu-latest
    outputs:
      # Surfaced so the downstream build-mcp / publish-mcp jobs know which tag
      # and version to publish, and whether to skip when this push didn't
      # actually need a new tag.
      tag: ${{ steps.read_version.outputs.tag }}
      version: ${{ steps.read_version.outputs.version }}
      skip: ${{ steps.check_tag.outputs.skip }}
    steps:
      - name: Checkout main
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          fetch-depth: 0   # need full history so `git tag` sees existing tags

      - name: Read version from plugin.json
        id: read_version
        run: |
          set -euo pipefail
          version=$(jq -r '.version' .claude-plugin/plugin.json)
          if [[ -z "$version" || "$version" == "null" ]]; then
            echo "::error::plugin.json has no .version field"
            exit 1
          fi
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::plugin.json .version=$version is not semver-like (X.Y.Z)"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"

      - name: Skip if tag already exists
        id: check_tag
        run: |
          set -euo pipefail
          tag="${{ steps.read_version.outputs.tag }}"
          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null 2>&1; then
            echo "Tag $tag already exists, nothing to do."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "Tag $tag does not exist yet."
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create and push tag
        if: steps.check_tag.outputs.skip == 'false'
        run: |
          set -euo pipefail
          tag="${{ steps.read_version.outputs.tag }}"
          version="${{ steps.read_version.outputs.version }}"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Single-line tag message; the user-facing release notes are
          # auto-populated below by softprops/action-gh-release.
          git tag -a "$tag" -m "Auto-tagged from .claude-plugin/plugin.json bump to $version"

          git push origin "$tag"
          echo "Pushed tag $tag"

      - name: Build cloud-finops-${tag}.zip
        if: steps.check_tag.outputs.skip == 'false'
        id: build_zip
        run: |
          set -euo pipefail
          tag="${{ steps.read_version.outputs.tag }}"
          ZIP_NAME="cloud-finops-${tag}.zip"
          # Same exclusions as release.yml so the artefact is identical
          # whether it comes from auto-tag or from a manual tag push.
          # cd into skills/ so the zip root contains `cloud-finops/...` rather
          # than `skills/cloud-finops/...`. Backward-compatible with the
          # Claude.ai / Claude Desktop upload path (Settings -> Skills -> Upload).
          (cd skills && zip -r "../${ZIP_NAME}" cloud-finops \
            -x 'cloud-finops/.claude/*' \
            -x 'cloud-finops/**/.backups/*' \
            -x 'cloud-finops/.git/*')
          ls -lh "${ZIP_NAME}"
          unzip -l "${ZIP_NAME}" | head -5
          echo "zip_name=${ZIP_NAME}" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release with zip attached
        if: steps.check_tag.outputs.skip == 'false'
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65  # v2.6.2
        with:
          name: ${{ steps.read_version.outputs.tag }}
          tag_name: ${{ steps.read_version.outputs.tag }}
          files: ${{ steps.build_zip.outputs.zip_name }}
          generate_release_notes: true
          body: |
            ## Cloud FinOps Skill & MCP ${{ steps.read_version.outputs.tag }}

            The attached `cloud-finops-${{ steps.read_version.outputs.tag }}.zip` is the skill bundle for upload into Claude Desktop / claude.ai (Settings -> Skills -> Upload).

            For Claude Code users (and 11 other tools), see [INSTALLATION.md](https://github.com/OptimNow/cloud-finops-skills/blob/main/INSTALLATION.md) for the cross-tool installer and the model-agnostic response contract.

  # Build the cloud-finops-mcp wheel + sdist for the just-tagged version.
  #
  # Why these steps are duplicated from publish-mcp.yml instead of invoked via
  # workflow_call: PyPI Trusted Publishing does NOT support reusable workflows
  # (https://docs.pypi.org/trusted-publishers/troubleshooting/#reusable-workflows-on-github).
  # The 2026-05-15 attempt at workflow_call published the wheels but the
  # attestation build_config_uri claim pointed to this workflow rather than the
  # called one, and PyPI rejected the upload. Inlining the steps means PyPI sees
  # `auto-tag-on-plugin-bump.yml` as the trusted publisher directly.
  #
  # One-time PyPI setup required: in cloud-finops-mcp's project settings on PyPI,
  # add this repo as a SECOND trusted publisher with workflow filename
  # `auto-tag-on-plugin-bump.yml` and environment `pypi`. The existing
  # `publish-mcp.yml` entry is preserved so manual git-push-tag and
  # workflow_dispatch recovery paths continue to publish.
  build-mcp:
    name: Build cloud-finops-mcp wheel + sdist
    needs: tag-and-release
    if: needs.tag-and-release.outputs.skip == 'false'
    runs-on: ubuntu-latest
    # Build-only job: checkout + build + upload artifact. Does not need the
    # workflow-level `contents: write` that tag-and-release requires, so
    # scope it down (least privilege - a compromised build dep gets read-only).
    permissions:
      contents: read
    steps:
      - name: Checkout tagged commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          ref: ${{ needs.tag-and-release.outputs.tag }}

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: '3.12'

      - name: Pin pyproject version to tag
        working-directory: mcp_server
        env:
          VERSION: ${{ needs.tag-and-release.outputs.version }}
        run: |
          # Same logic as publish-mcp.yml: the pyproject.toml version field
          # must equal the git tag so wheel filenames and PyPI metadata agree.
          python - <<'PY'
          import os, pathlib, re
          version = os.environ["VERSION"]
          path = pathlib.Path("pyproject.toml")
          text = path.read_text(encoding="utf-8")
          new = re.sub(r'^version = ".*"', f'version = "{version}"', text, count=1, flags=re.M)
          path.write_text(new, encoding="utf-8")
          print(f"pyproject.toml version pinned to {version}")
          PY

      - name: Sync references into bundled data/
        working-directory: mcp_server
        run: python scripts/sync_references.py

      - name: Install build tooling
        run: python -m pip install --upgrade pip build

      - name: Build sdist + wheel
        working-directory: mcp_server
        run: python -m build

      - name: Upload artefacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: pypi-dist
          path: mcp_server/dist/
          # Inter-job plumbing only; the durable copy is on PyPI. Default
          # retention is 90 days, which is far longer than this artifact's
          # value (zero once the publish job succeeds).
          retention-days: 7

  publish-mcp:
    name: Publish cloud-finops-mcp to PyPI
    needs: build-mcp
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/cloud-finops-mcp
    permissions:
      contents: read
      id-token: write   # required for PyPI trusted publishing (OIDC)
    steps:
      - name: Download artefacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4.3.0
        with:
          name: pypi-dist
          path: dist/

      # Pinned at v1.14.2, not v1.14.0. hatchling (pinned `>=1.18,<2`, so it
      # floats within the major) now emits `Metadata-Version: 2.5`, and the
      # twine bundled in v1.14.0 rejects it outright:
      #   InvalidDistribution: '2.5' is not a valid metadata version
      # That broke the 1.28.1 publish on 2026-08-16 after the tag, the GitHub
      # Release and the wheel build had all succeeded. v1.14.2 ships twine 7,
      # which accepts metadata 2.5. Both this workflow and its counterpart must
      # move together - they are duplicated on purpose (see the comment above
      # the build job) and a fix applied to only one leaves the other broken.
      - name: Publish via trusted publishing
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33  # v1.14.2
        with:
          packages-dir: dist/
