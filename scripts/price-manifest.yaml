      filter: serviceName eq 'Virtual Network' and armRegionName eq 'Global' and priceType eq 'Consumption' and productName eq 'Virtual Network Private Link' and meterName eq 'Standard Private Endpoint'
  azure-inter-region-transfer-gb:
    provider: azure
    unit: USD per GB out of the source region
    query:
      filter: serviceName eq 'Bandwidth' and armRegionName eq 'eastus' and priceType eq 'Consumption' and meterName eq 'Standard Inter-Region Data Transfer'
